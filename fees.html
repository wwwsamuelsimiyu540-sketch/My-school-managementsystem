
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Fees Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#f1f5f9;color:#1e293b}
header{background:#123b70;color:white;padding:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
main{max-width:1100px;margin:25px auto;padding:0 14px}
.card{background:white;padding:20px;border-radius:10px;margin-bottom:20px}
h2{color:#123b70}label{display:block;font-weight:bold;margin:10px 0 6px}
input,select{width:100%;padding:11px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button{padding:10px 14px;border:0;border-radius:6px;cursor:pointer;margin:4px;font-weight:bold}
.primary{background:#1763c6;color:white}.secondary{background:#475569;color:white}.danger{background:#dc2626;color:white}.success{background:#15803d;color:white}
#message{padding:10px;margin:10px 0;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#eaf1fb}
</style>
</head>
<body>
<header>
<h1>School Fees Management</h1>
<div>
<button id="dashboardBtn" class="secondary">Dashboard</button>
<button id="logoutBtn" class="danger">Log Out</button>
</div>
</header>

<main>
<div id="message" role="status"></div>

<section class="card">
<h2>Record a Fee Charge</h2>
<form id="feeForm">
<div class="grid">
<div><label for="studentSelect">Student</label><select id="studentSelect" required><option value="">Loading students...</option></select></div>
<div><label for="amountDue">Amount Due (KSh)</label><input id="amountDue" type="number" min="0" step="0.01" required></div>
<div><label for="description">Description</label><input id="description" maxlength="200" placeholder="e.g. Term 1 fees" required></div>
</div>
<button type="submit" id="feeSaveBtn" class="primary">Save Fee Charge</button>
</form>
</section>

<section class="card">
<h2>Record a Payment</h2>
<form id="paymentForm">
<div class="grid">
<div><label for="feeSelect">Fee Record</label><select id="feeSelect" required><option value="">Loading fee records...</option></select></div>
<div><label for="amountPaid">Amount Paid (KSh)</label><input id="amountPaid" type="number" min="0.01" step="0.01" required></div>
<div><label for="paymentDate">Payment Date</label><input id="paymentDate" type="date" required></div>
<div><label for="referenceNumber">Receipt/Reference Number</label><input id="referenceNumber" maxlength="100"></div>
</div>
<button type="submit" id="paymentSaveBtn" class="success">Record Payment</button>
</form>
</section>

<section class="card">
<h2>Fee Balances</h2>
<button id="refreshBtn" class="primary">Refresh Records</button>
<div id="feesTable" class="tablewrap">Loading fee records...</div>
</section>
</main>

<script>
const SUPABASE_URL="YOUR_EXISTING_SUPABASE_PROJECT_URL";
const SUPABASE_KEY="YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const message=document.getElementById("message");
const studentSelect=document.getElementById("studentSelect");
const feeSelect=document.getElementById("feeSelect");
const feesTable=document.getElementById("feesTable");

function showMessage(text,ok=false){
 message.textContent=text;
 message.style.background=ok?"#dcfce7":"#fee2e2";
 message.style.color=ok?"#166534":"#991b1b";
}
function today(){
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

async function start(){
 const {data,error}=await client.auth.getSession();
 if(error){showMessage(error.message);return;}
 if(!data.session){location.replace("index.html");return;}
 document.getElementById("paymentDate").value=today();
 await loadStudents();
 await loadFees();
}

async function loadStudents(){
 const {data,error}=await client.from("students")
  .select("id,admission_number,first_name,last_name").order("first_name");
 if(error){showMessage(error.message);return;}
 studentSelect.replaceChildren(new Option("Choose student",""));
 (data||[]).forEach(s=>{
  studentSelect.add(new Option(`${s.admission_number} — ${s.first_name} ${s.last_name}`,s.id));
 });
}

async function loadFees(){
 feesTable.textContent="Loading fee records...";
 const [fees,payments]=await Promise.all([
  client.from("fee_records").select("id,student_id,amount_due,description,created_at,students(admission_number,first_name,last_name)").order("id",{ascending:false}),
  client.from("payments").select("fee_record_id,amount_paid")
 ]);

 if(fees.error||payments.error){
  showMessage((fees.error||payments.error).message);
  feesTable.textContent="Unable to load fee records.";
  return;
 }

 const paid=new Map();
 (payments.data||[]).forEach(p=>{
  const key=String(p.fee_record_id);
  paid.set(key,(paid.get(key)||0)+Number(p.amount_paid));
 });

 feeSelect.replaceChildren(new Option("Choose fee record",""));
 (fees.data||[]).forEach(f=>{
  const s=f.students||{};
  const balance=Number(f.amount_due)-(paid.get(String(f.id))||0);
  feeSelect.add(new Option(
   `#${f.id} — ${s.first_name||""} ${s.last_name||""} — ${f.description} — Balance KSh ${balance.toFixed(2)}`,
   f.id
  ));
 });

 feesTable.replaceChildren();
 if(!fees.data?.length){
  feesTable.textContent="No fee charges recorded yet.";
  return;
 }

 const table=document.createElement("table");
 table.innerHTML="<thead><tr><th>Admission No.</th><th>Student</th><th>Description</th><th>Due (KSh)</th><th>Paid (KSh)</th><th>Balance (KSh)</th></tr></thead>";
 const tbody=document.createElement("tbody");

 fees.data.forEach(f=>{
  const s=f.students||{};
  const due=Number(f.amount_due);
  const totalPaid=paid.get(String(f.id))||0;
  const values=[
   s.admission_number||"",
   `${s.first_name||""} ${s.last_name||""}`,
   f.description,
   due.toFixed(2),
   totalPaid.toFixed(2),
   (due-totalPaid).toFixed(2)
  ];
  const tr=document.createElement("tr");
  values.forEach(value=>{
   const td=document.createElement("td");
   td.textContent=value;
   tr.appendChild(td);
  });
  tbody.appendChild(tr);
 });

 table.appendChild(tbody);
 feesTable.appendChild(table);
}

document.getElementById("feeForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const payload={
  student_id:Number(studentSelect.value),
  amount_due:Number(document.getElementById("amountDue").value),
  description:document.getElementById("description").value.trim()
 };

 if(!payload.student_id||!payload.description||!Number.isFinite(payload.amount_due)||payload.amount_due<0){
  showMessage("Enter a student, description, and valid fee amount.");
  return;
 }

 const btn=document.getElementById("feeSaveBtn");
 btn.disabled=true;
 const {error}=await client.from("fee_records").insert([payload]);
 btn.disabled=false;

 if(error){showMessage(error.message);return;}
 e.target.reset();
 showMessage("Fee charge recorded successfully.",true);
 await loadFees();
});

document.getElementById("paymentForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const payload={
  fee_record_id:Number(feeSelect.value),
  amount_paid:Number(document.getElementById("amountPaid").value),
  payment_date:document.getElementById("paymentDate").value,
  reference_number:document.getElementById("referenceNumber").value.trim()||null
 };

 if(!payload.fee_record_id||!Number.isFinite(payload.amount_paid)||payload.amount_paid<=0||!payload.payment_date){
  showMessage("Choose a fee record and enter a valid payment and date.");
  return;
 }

 const btn=document.getElementById("paymentSaveBtn");
 btn.disabled=true;
 const {error}=await client.from("payments").insert([payload]);
 btn.disabled=false;

 if(error){showMessage(error.message);return;}

 document.getElementById("amountPaid").value="";
 document.getElementById("referenceNumber").value="";
 document.getElementById("paymentDate").value=today();
 showMessage("Payment recorded successfully.",true);
 await loadFees();
});

document.getElementById("refreshBtn").addEventListener("click",loadFees);
document.getElementById("dashboardBtn").addEventListener("click",()=>location.href="index.html");
document.getElementById("logoutBtn").addEventListener("click",async()=>{
 if(!confirm("Log out?"))return;
 const {error}=await client.auth.signOut();
 if(error){showMessage(error.message);return;}
 location.replace("index.html");
});
start();
</script>
</body>
  </html>
