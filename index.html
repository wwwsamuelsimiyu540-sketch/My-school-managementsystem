<section id="teachersSection" class="tile"
         style="display:none; margin-top:20px;">

  <script>
    // Replace both values with your own Supabase project details.
    const SUPABASE_URL = "https://apshhzczrofxwjsgenlv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I6kPWgrxTxCgo_EUCGucLA_LtiJXtyP";

    const loginSection = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    let client = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type || "";
    }

    function showDashboard(user) {
      loginSection.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("welcome").textContent =
        "Welcome, " + (user.email || "user");
    }

    async function startApp() {
      if (!window.supabase) {
        showMessage("Could not load the Supabase library. Check your internet connection and reload.", "error");
        return;
      }

      if (SUPABASE_URL.includes("PASTE_") ||
          SUPABASE_KEY.includes("PASTE_")) {
        showMessage("Please add your Supabase Project URL and publishable key in the code.", "error");
        return;
      }

      try {
        client = window.supabase.createClient(
          SUPABASE_URL, SUPABASE_KEY
        );

        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        if (data.session) showDashboard(data.session.user);

        client.auth.onAuthStateChange((_event, session) => {
          if (session) {
            showDashboard(session.user);
          } else {
            dashboard.style.display = "none";
            loginSection.style.display = "block";
          }
        });
      } catch (error) {
        showMessage("Setup error: " + error.message, "error");
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!client) {
        showMessage("Supabase is not configured. Check the URL and publishable key.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      showMessage("", "");

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        showDashboard(data.user);
      } catch (error) {
        showMessage("Login failed: " + error.message, "error");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Log in";
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async function() {
      const { error } = await client.auth.signOut();
      if (error) {
        alert("Could not log out: " + error.message);
      }
    });

    startApp();
    
const teacherForm = document.getElementById("teacherForm");
const teacherMessage = document.getElementById("teacherMessage");
const teachersTableBody = document.getElementById("teachersTableBody");
const saveTeacherButton = document.getElementById("saveTeacherButton");

function showTeacherMessage(text, isError = false) {
  teacherMessage.textContent = text;
  teacherMessage.style.color = isError ? "#b91c1c" : "#166534";
}

async function loadTeachers() {
  if (!client) {
    showTeacherMessage("Supabase is not connected.", true);
    return;
  }

  teachersTableBody.innerHTML =
    '<tr><td colspan="4">Loading teachers...</td></tr>';

  const { data, error } = await client
    .from("teachers")
    .select("id, full_name, email, phone")
    .order("full_name");

  if (error) {
    teachersTableBody.innerHTML = "";
    showTeacherMessage("Could not load teachers: " + error.message, true);
    return;
  }

  teachersTableBody.innerHTML = "";

  if (!data.length) {
    teachersTableBody.innerHTML =
      '<tr><td colspan="4">No teachers registered yet.</td></tr>';
    return;
  }

  data.forEach(function(teacher) {
    const row = document.createElement("tr");

    [teacher.full_name, teacher.email || "-", teacher.phone || "-"]
      .forEach(function(value) {
        const cell = document.createElement("td");
        cell.style.padding = "8px";
        cell.style.borderBottom = "1px solid #ddd";
        cell.textContent = value;
        row.appendChild(cell);
      });

    const actionCell = document.createElement("td");
    actionCell.style.padding = "8px";

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.textContent = "Delete";
    deleteButton.style.margin = "0";

    deleteButton.addEventListener("click", async function() {
      if (!confirm("Delete teacher " + teacher.full_name + "?")) return;

      deleteButton.disabled = true;

      const { error: deleteError } = await client
        .from("teachers")
        .delete()
        .eq("id", teacher.id);

      if (deleteError) {
        showTeacherMessage(
          "Could not delete teacher: " + deleteError.message, true
        );
        deleteButton.disabled = false;
        return;
      }

      showTeacherMessage("Teacher deleted successfully.");
      await loadTeachers();
    });

    actionCell.appendChild(deleteButton);
    row.appendChild(actionCell);
    teachersTableBody.appendChild(row);
  });
}

teacherForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!client) {
    showTeacherMessage("Supabase is not connected.", true);
    return;
  }

  saveTeacherButton.disabled = true;
  showTeacherMessage("Saving teacher...");

  try {
    const fullName = document.getElementById("teacherName").value.trim();
    const email = document.getElementById("teacherEmail").value.trim();
    const phone = document.getElementById("teacherPhone").value.trim();

    if (!fullName) {
      showTeacherMessage("Please enter the teacher's full name.", true);
      return;
    }

    const { error } = await client.from("teachers").insert([{
      full_name: fullName,
      email: email || null,
      phone: phone || null
    }]);

    if (error) throw error;

    teacherForm.reset();
    showTeacherMessage("Teacher registered successfully!");
    await loadTeachers();

  } catch (error) {
    showTeacherMessage("Could not save teacher: " + error.message, true);
  } finally {
    saveTeacherButton.disabled = false;
  }
});

document.getElementById("refreshTeachersButton")
  .addEventListener("click", loadTeachers);

document.getElementById("openTeachersButton")
  .addEventListener("click", function() {
    const section = document.getElementById("teachersSection");

    section.style.display = "block";
    section.scrollIntoView({ behavior: "smooth" });

    loadTeachers();
  });
    
    
  </script>
