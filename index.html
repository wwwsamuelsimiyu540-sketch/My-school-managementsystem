
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Management System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    .card {
      max-width: 430px;
      margin: 55px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 24px #0001;
    }
    h1, h2 { color: #174ea6; }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #174ea6;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { white-space: pre-wrap; }
    .error { color: #b91c1c; }
    .success { color: #166534; }
    #dashboard { display: none; padding: 20px; }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 14px;
    }
    .tile {
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 10px #0001;
    }
    .tile h3 { margin-top: 0; }
  </style>
</head>
<body>
  <section class="card" id="login">
    <h1>School Login</h1>
    <p>Grades 1–9 School Management System</p>
    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" required
             placeholder="admin@example.com" autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required
             placeholder="Enter your password"
             autocomplete="current-password">

      <button id="loginButton" type="submit">Log in</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <main id="dashboard">
    <h1>School Dashboard</h1>
    <p id="welcome">Welcome</p>
    <div class="tiles">
      <div class="tile"><h3>Students</h3><p>Manage student records.</p></div>
      <div class="tile"><h3>Teachers</h3><p>Manage teacher records.</p></div>
      <div class="tile"><h3>Classes</h3><p>Manage Grades 1–9.</p></div>
      <div class="tile"><h3>Attendance</h3><p>Track student attendance.</p></div>
      <div class="tile"><h3>Results</h3><p>Manage assessments and marks.</p></div>
      <div class="tile"><h3>Fees</h3><p>Manage fee records and payments.</p></div>
    </div>
    <button id="logoutButton">Log out</button>
  </main>

  <script>
    // Replace both values with your own Supabase project details.
    const SUPABASE_URL = "https://apshhzczrofxwjsgenlv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I6kPWgrxTxCgo_EUCGucLA_LtiJXtyP";

    const loginSection = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    let client = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type || "";
    }

    function showDashboard(user) {
      loginSection.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("welcome").textContent =
        "Welcome, " + (user.email || "user");
    }

    async function startApp() {
      if (!window.supabase) {
        showMessage("Could not load the Supabase library. Check your internet connection and reload.", "error");
        return;
      }

      if (SUPABASE_URL.includes("PASTE_") ||
          SUPABASE_KEY.includes("PASTE_")) {
        showMessage("Please add your Supabase Project URL and publishable key in the code.", "error");
        return;
      }

      try {
        client = window.supabase.createClient(
          SUPABASE_URL, SUPABASE_KEY
        );

        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        if (data.session) showDashboard(data.session.user);

        client.auth.onAuthStateChange((_event, session) => {
          if (session) {
            showDashboard(session.user);
          } else {
            dashboard.style.display = "none";
            loginSection.style.display = "block";
          }
        });
      } catch (error) {
        showMessage("Setup error: " + error.message, "error");
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!client) {
        showMessage("Supabase is not configured. Check the URL and publishable key.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      showMessage("", "");

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        showDashboard(data.user);
      } catch (error) {
        showMessage("Login failed: " + error.message, "error");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Log in";
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async function() {
      const { error } = await client.auth.signOut();
      if (error) {
        alert("Could not log out: " + error.message);
      }
    });

    startApp();
  </script>
</body>
                                            </html>
