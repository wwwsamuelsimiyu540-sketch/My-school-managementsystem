<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>School Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        /* ================= LOGIN ================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #173b70,
                #2563a6
            );
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: auto;
            margin-bottom: 15px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #173b70;
            color: white;

            font-size: 30px;
            font-weight: bold;
        }

        .login-box h1 {
            text-align: center;
            color: #173b70;
            margin-bottom: 5px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-group input,
        .input-group select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;
        }

        .input-group input:focus,
        .input-group select:focus {

            border-color: #2563a6;
        }

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #173b70;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .login-button:hover {
            background: #2563a6;
        }

        .error-message {

            display: none;

            color: #dc3545;

            text-align: center;

            margin-top: 15px;
        }


        /* ================= DASHBOARD ================= */

        .dashboard {

            display: none;

            min-height: 100vh;
        }


        /* SIDEBAR */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 250px;

            height: 100vh;

            background: #173b70;

            color: white;
        }

        .school-name {

            padding: 25px;

            text-align: center;

            border-bottom:
                1px solid
                rgba(255,255,255,0.15);
        }

        .school-name h2 {
            margin-bottom: 5px;
        }

        .school-name small {
            color: #cbd5e1;
        }

        .menu {
            padding: 15px;
        }

        .menu button {

            width: 100%;

            padding: 13px;

            margin-bottom: 5px;

            border: none;

            background: transparent;

            color: white;

            text-align: left;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
        }

        .menu button:hover,
        .menu button.active {

            background: #2563a6;
        }


        /* MAIN CONTENT */

        .main {

            margin-left: 250px;

            min-height: 100vh;
        }

        .topbar {

            height: 70px;

            background: white;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0 25px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.08);
        }

        .topbar h2 {
            color: #173b70;
        }

        .user {

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .user-icon {

            width: 40px;
            height: 40px;

            border-radius: 50%;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #173b70;

            color: white;

            font-weight: bold;
        }


        /* CONTENT */

        .content {
            padding: 25px;
        }

        .content h1 {
            color: #173b70;
            margin-bottom: 8px;
        }

        .content-description {
            color: #777;
            margin-bottom: 25px;
        }


        /* CARDS */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }

        .card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.07);
        }

        .card h3 {

            color: #777;

            font-size: 14px;

            margin-bottom: 10px;
        }

        .card-number {

            color: #173b70;

            font-size: 30px;

            font-weight: bold;
        }


        /* MOBILE */

        @media(max-width: 800px) {

            .sidebar {

                width: 200px;
            }

            .main {

                margin-left: 200px;
            }

            .cards {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {

            .sidebar {

                display: none;
            }

            .main {

                margin-left: 0;
            }

            .cards {

                grid-template-columns: 1fr;
            }

            .login-box {

                width: 90%;
            }
        }

    </style>

</head>


<body>


<!-- ================================================= -->
<!-- LOGIN PAGE -->
<!-- ================================================= -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <div class="logo">
            S
        </div>

        <h1>
            School System
        </h1>

        <p>
            Grades 1 – 9 Management System
        </p>


        <!-- USERNAME -->

        <div class="input-group">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

        </div>


        <!-- ROLE -->

        <div class="input-group">

            <label>
                Login As
            </label>

            <select id="role">

                <option value="Administrator">
                    Administrator
                </option>

                <option value="Teacher">
                    Teacher
                </option>

                <option value="Accountant">
                    Accountant
                </option>

                <option value="Parent">
                    Parent
                </option>

                <option value="Student">
                    Student
                </option>

            </select>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            class="login-button"
            onclick="login()">

            Login

        </button>


        <!-- ERROR -->

        <div
            class="error-message"
            id="errorMessage">

            Please enter your username
            and password.

        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- DASHBOARD -->
<!-- ================================================= -->

<div
    class="dashboard"
    id="dashboard">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="school-name">

            <h2>
                🏫 My School
            </h2>

            <small>
                Grades 1 – 9
            </small>

        </div>


        <div class="menu">

            <button
                class="active"
                onclick="showMessage('Dashboard')">

                🏠 Dashboard

            </button>


            <button
                onclick="showMessage('Students')">

                👨‍🎓 Students

            </button>


            <button
                onclick="showMessage('Classes')">

                🏫 Classes

            </button>


            <button
                onclick="showMessage('Teachers')">

                👨‍🏫 Teachers

            </button>


            <button
                onclick="showMessage('Subjects')">

                📚 Subjects

            </button>


            <button
                onclick="showMessage('Attendance')">

                📅 Attendance

            </button>


            <button
                onclick="showMessage('Results')">

                📝 Results

            </button>


            <button
                onclick="showMessage('Fees')">

                💰 School Fees

            </button>


            <button
                onclick="showMessage('Timetable')">

                🕐 Timetable

            </button>


            <button
                onclick="showMessage('Reports')">

                📊 Reports

            </button>


            <button
                onclick="showMessage('Settings')">

                ⚙️ Settings

            </button>


            <button
                onclick="logout()">

                🚪 Logout

            </button>

        </div>

    </aside>



    <!-- MAIN -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <h2 id="pageTitle">
                Dashboard
            </h2>


            <div class="user">

                <span id="userName">
                    Administrator
                </span>

                <div class="user-icon">
                    A
                </div>

            </div>

        </header>



        <!-- CONTENT -->

        <section class="content">

            <h1>
                Welcome to your School System
            </h1>

            <p class="content-description">

                Manage your school activities
                from Grade 1 to Grade 9.

            </p>


            <!-- STATISTICS -->

            <div class="cards">


                <div class="card">

                    <h3>
                        Total Students
                    </h3>

                    <div
                        class="card-number">

                        0

                    </div>

                </div>


                <div class="card">

                    <h3>
                        Teachers
                    </h3>

                    <div
                        class="card-number">

                        0

                    </div>

                </div>


                <div class="card">

                    <h3>
                        Classes
                    </h3>

                    <div
                        class="card-number">

                        0

                    </div>

                </div>


                <div class="card">

                    <h3>
                        Attendance
                    </h3>

                    <div
                        class="card-number">

                        0%

                    </div>

                </div>


            </div>

        </section>

    </main>

</div>



<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script>


/* ================= LOGIN ================= */

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const role =
        document.getElementById("role").value;

    const error =
        document.getElementById("errorMessage");


    /* CHECK EMPTY FIELDS */

    if (username === "" || password === "") {

        error.style.display = "block";

        return;
    }


    /* HIDE ERROR */

    error.style.display = "none";


    /* HIDE LOGIN */

    document.getElementById("loginPage")
        .style.display = "none";


    /* SHOW DASHBOARD */

    document.getElementById("dashboard")
        .style.display = "block";


    /* DISPLAY USER */

    document.getElementById("userName")
        .textContent =
        username + " (" + role + ")";

}


/* ================= LOGOUT ================= */

function logout() {

    document.getElementById("dashboard")
        .style.display = "none";


    document.getElementById("loginPage")
        .style.display = "flex";


    document.getElementById("username")
        .value = "";


    document.getElementById("password")
        .value = "";

}


/* ================= MENU ================= */

function showMessage(page) {

    document.getElementById("pageTitle")
        .textContent = page;

    alert(
        page +
        " module will be developed next."
    );

}

</script>


</body>

  </html>
