<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | My School System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#123b67;color:white;padding:18px}
main{max-width:1100px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin:20px 0;box-shadow:0 2px 8px #0001}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:6px;margin:6px 0 12px;width:100%}
button{padding:10px 15px;border:0;border-radius:6px;background:#1266b1;color:white;cursor:pointer;margin:3px}
.back{background:#475569}
.danger{background:#dc2626}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#eaf2fb}
#message{font-weight:bold}
</style>
</head>
<body>
<header>
<h2>📅 My School System — Attendance</h2>
<p>Record and manage daily student attendance</p>
</header><main>
<button class="back" onclick="location.href='school-admin.html'">← Back to Dashboard</button><section class="card">
<h3>Record Attendance</h3>
<form id="attendanceForm">
<label>Admission Number *</label>
<input id="admission" required placeholder="Enter student admission number"><label>Student Name *</label>
<input id="studentName" required placeholder="Enter student full name">

<label>Class / Grade *</label>
<input id="className" required placeholder="e.g. Grade 6">

<label>Attendance Date *</label>
<input id="attendanceDate" type="date" required>

<label>Status *</label>
<select id="status" required>

<option value="Present">Present</option>
<option value="Absent">Absent</option>
<option value="Late">Late</option>
<option value="Excused">Excused</option>
</select><label>Remarks</label>
<input id="remarks" placeholder="Optional remarks">

<button type="submit">Save Attendance</button>
<button type="reset" class="back">Clear Form</button>

</form>
<p id="message" role="status"></p>
</section><section class="card">
<h3>Attendance Records</h3>
<label>Filter by date</label>
<input type="date" id="filterDate" oninput="displayRecords()"><label>Search student or class</label>
<input id="search" placeholder="Enter name, admission number or class" oninput="displayRecords()">

<p id="summary">Records: 0</p>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th>
<th>Admission No.</th>
<th>Student Name</th>
<th>Class</th>
<th>Status</th>
<th>Remarks</th>
<th>Action</th>
</tr>
</thead>
<tbody id="attendanceRows"></tbody>
</table>
</div>
</section>
</main><script>
const STORAGE_KEY = "mySchoolAttendance";

function getRecords(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []}
  catch{return []}
}

function displayRecords(){
  const filterDate=document.getElementById("filterDate").value;
  const query=document.getElementById("search").value.toLowerCase();

  const records=getRecords().filter(r=>{
    const matchesDate=!filterDate || r.date===filterDate;
    const matchesSearch=[r.admission,r.studentName,r.className]
      .some(v=>(v||"").toLowerCase().includes(query));
    return matchesDate && matchesSearch;
  });

  const present=records.filter(r=>r.status==="Present").length;
  const absent=records.filter(r=>r.status==="Absent").length;
  const late=records.filter(r=>r.status==="Late").length;

  document.getElementById("summary").textContent =
    `Records: ${records.length} | Present: ${present} | Absent: ${absent} | Late: ${late}`;

  const tbody=document.getElementById("attendanceRows");
  tbody.innerHTML="";

  records.forEach(record=>{
    const tr=document.createElement("tr");
    [record.date,record.admission,record.studentName,record.className,
     record.status,record.remarks].forEach(value=>{
      const td=document.createElement("td");
      td.textContent=value||"—";
      tr.appendChild(td);
    });

    const action=document.createElement("td");
    const btn=document.createElement("button");
    btn.textContent="Delete";
    btn.className="danger";
    btn.onclick=()=>deleteRecord(record.id);
    action.appendChild(btn);
    tr.appendChild(action);
    tbody.appendChild(tr);
  });
}

document.getElementById("attendanceForm").addEventListener("submit",function(e){
  e.preventDefault();

  const record={
    id:Date.now().toString(),
    admission:document.getElementById("admission").value.trim(),
    studentName:document.getElementById("studentName").value.trim(),
    className:document.getElementById("className").value.trim(),
    date:document.getElementById("attendanceDate").value,
    status:document.getElementById("status").value,
    remarks:document.getElementById("remarks").value.trim()
  };

  const records=getRecords();
  const duplicate=records.some(r=>
    r.admission.toLowerCase()===record.admission.toLowerCase() &&
    r.date===record.date
  );

  if(duplicate){
    showMessage("Attendance has already been recorded for this student on this date.",true);
    return;
  }

  records.push(record);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
  this.reset();
  document.getElementById("attendanceDate").value=new Date().toISOString().slice(0,10);
  showMessage("Attendance saved successfully in this browser.",false);
  displayRecords();
});

function deleteRecord(id){
  if(!confirm("Delete this attendance record?"))return;
  const records=getRecords().filter(r=>r.id!==id);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
  displayRecords();
  showMessage("Attendance record deleted.",false);
}

function showMessage(text,error){
  const el=document.getElementById("message");
  el.textContent=text;
  el.style.color=error?"#dc2626":"#15803d";
}

document.getElementById("attendanceDate").value=new Date().toISOString().slice(0,10);
displayRecords();
</script></body>
</html>
