<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My School System | Developer Console</title>
<style>
:root{--navy:#111c3a;--navy2:#1b2a52;--blue:#4169e1;--cyan:#28c7d9;--bg:#f4f7fc;--card:#fff;--text:#17233d;--muted:#72809a;--line:#e5eaf3;--green:#14805e;--red:#c43d50;--amber:#a96b08;--shadow:0 8px 28px rgba(27,42,82,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{background:linear-gradient(180deg,var(--navy),#18264b);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 18px;border-bottom:1px solid #ffffff20}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),#6284ff);display:grid;place-items:center;font-size:22px;font-weight:900}.brand strong{display:block;font-size:15px}.brand small{color:#b9c7e7}.nav-label{font-size:10px;letter-spacing:1.6px;color:#94a5cd;padding:4px 12px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:11px;text-align:left;border:0;border-radius:10px;background:transparent;color:#d6def2;padding:11px 12px;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff17;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}.nav .ico{width:21px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid #ffffff20;padding:15px 8px 0;font-size:12px;color:#aebce0;line-height:1.7}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}.crumb{font-size:12px;color:var(--muted)}.topbar h1{font-size:20px;margin:3px 0 0}.top-actions{display:flex;align-items:center;gap:10px}.mode{font-size:11px;border-radius:30px;padding:7px 11px;background:#fff4db;color:#8a5b04;border:1px solid #f1dfb6}.avatar{width:36px;height:36px;border-radius:50%;background:#e7edff;color:#3152b6;display:grid;place-items:center;font-weight:800}.content{padding:26px 28px 42px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.welcome h2{font-size:24px;margin:0 0 6px}.welcome p{margin:0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px 13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.success{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:#fff0f1;color:var(--red);border-color:#f4cdd2}.btn.small{padding:6px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.panel,.module-card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;background:#eef2ff;display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:27px;margin:14px 0 4px}.stat small{font-size:11px;color:var(--muted)}.layout-two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);gap:17px}.panel{padding:19px;margin-bottom:17px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel-head h3{font-size:15px;margin:0}.panel-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.field,select,textarea{border:1px solid #dfe5f0;background:#fff;border-radius:9px;padding:10px 11px;color:var(--text);outline:none;min-width:0}.field:focus,select:focus,textarea:focus{border-color:#8aa2ff;box-shadow:0 0 0 3px #4169e118}.filters .field{flex:1;min-width:150px}.filters select{min-width:130px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#f8faff;padding:12px 10px}td{padding:12px 10px;border-bottom:1px solid #edf0f6}tr:last-child td{border-bottom:0}.school-name{font-weight:750}.subline{font-size:10px;color:var(--muted);margin-top:4px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800;text-transform:capitalize}.badge.pending{background:#fff3d8;color:#9a6505}.badge.approved,.badge.active,.badge.resolved{background:#e1f7ee;color:#147453}.badge.rejected,.badge.suspended,.badge.inactive{background:#ffe8eb;color:#b02e44}.badge.open,.badge.in-progress{background:#e7efff;color:#3159bc}.actions{display:flex;gap:5px}.empty{text-align:center;padding:28px;color:var(--muted)}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{border:1px solid var(--line);border-radius:11px;padding:13px;text-align:left;background:#fff;display:flex;gap:10px;align-items:center}.quick:hover{border-color:#a8b8ff;background:#f9faff}.quick .qicon{font-size:19px}.quick strong{font-size:12px;display:block}.quick small{font-size:10px;color:var(--muted)}.activity{display:grid;gap:14px}.activity-item{display:flex;gap:10px;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:4px;flex-shrink:0}.activity-item strong{font-size:12px;display:block}.activity-item small{font-size:10px;color:var(--muted)}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}.page-title h2{font-size:22px;margin:0}.page-title p{font-size:12px;color:var(--muted);margin:5px 0 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-field{display:grid;gap:6px;font-size:12px;font-weight:700}.form-field input,.form-field select,.form-field textarea{width:100%;font-weight:400}.form-field.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.plan{padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff}.plan h3{margin:0 0 8px}.price{font-size:27px;font-weight:850;margin:15px 0}.plan p,.muted{font-size:12px;color:var(--muted)}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.module-card{padding:17px}.module-card .bigico{font-size:23px}.module-card h3{font-size:14px;margin:11px 0 6px}.module-card p{font-size:11px;line-height:1.6;color:var(--muted);min-height:34px}.module-card button{margin-top:8px}.notice{border:1px solid #f0dfb6;background:#fff9e9;color:#805a0a;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.5;margin-bottom:16px}.notice.info{border-color:#d7e2ff;background:#f3f6ff;color:#3554a1}.hidden{display:none!important}.toast-wrap{position:fixed;right:18px;top:18px;z-index:1000;display:grid;gap:8px}.toast{background:#142345;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0002;font-size:12px;max-width:330px;animation:slide .2s ease}.toast.bad{background:#a82f42}.toast.good{background:#117455}@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}.modal-backdrop{position:fixed;inset:0;background:#0d183c88;z-index:900;display:grid;place-items:center;padding:18px}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0003}.modal h2{margin:0 0 18px;font-size:19px}.modal-top{display:flex;align-items:center;justify-content:space-between}.xbtn{border:0;background:#f1f4fa;border-radius:8px;width:32px;height:32px;font-size:19px}.mobile-menu{display:none}.footer-note{text-align:center;color:var(--muted);font-size:10px;padding:10px}.connection{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-two{grid-template-columns:1fr}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.plan-grid{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:700;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 30px #0002}.sidebar.open{transform:translateX(0)}.topbar{height:66px;padding:0 15px}.topbar h1{font-size:17px}.content{padding:18px 14px 30px}.welcome{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.module-grid,.quick-grid,.form-grid{grid-template-columns:1fr}.top-actions .mode{display:none}.mobile-menu{display:inline-flex}.page-title{align-items:flex-start;flex-direction:column}.panel{padding:13px}.table-wrap{margin:0 -5px}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">M</div><div><strong>My School System</strong><small>Developer Console</small></div></div>
  <div>
    <div class="nav-label">MAIN MENU</div>
    <nav class="nav" id="nav">
      <button class="active" data-page="overview"><span class="ico">▦</span>Overview</button>
      <button data-page="schools"><span class="ico">🏫</span>School Management</button>
      <button data-page="users"><span class="ico">♙</span>User Management</button>
      <button data-page="subscriptions"><span class="ico">💳</span>Subscriptions & Plans</button>
      <button data-page="notifications"><span class="ico">🔔</span>Notifications</button>
      <button data-page="support"><span class="ico">🎧</span>Support Center</button>
      <button data-page="reports"><span class="ico">📊</span>Reports & Analytics</button>
      <button data-page="activity"><span class="ico">🕘</span>Activity Logs</button>
      <button data-page="settings"><span class="ico">⚙</span>Platform Settings</button>
      <button data-page="modules"><span class="ico">▤</span>All Modules</button>
      <button data-page="connection"><span class="ico">🔌</span>Database Connection</button>
    </nav>
  </div>
  <div class="side-bottom">My School System<br><span id="sideMode">Interactive preview mode</span><br>Version 1.0</div>
</aside>
<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><div><div class="crumb">Developer / <span id="crumb">Overview</span></div><h1 id="topTitle">Platform Overview</h1></div></div>
  <div class="top-actions"><span class="mode" id="modeBadge">● Preview mode</span><button class="btn" id="refreshBtn">↻ Refresh</button><div class="avatar" title="Developer">D</div></div>
</header>
<div class="content" id="content"></div>
<div class="footer-note">My School System • Preview changes are stored in this browser only until database connection is configured.</div>
</main>
</div>
<div class="toast-wrap" id="toasts"></div>
<div id="modalRoot"></div>
<script>
'use strict';
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const STORE='myschool_dev_dashboard_preview_v1';
const initial={
 schools:[
  {id:'SCH-1001',school_code:'MS-1001',school_name:'Green Valley Academy',email:'admin@greenvalley.example',phone:'+254 700 111 222',address:'Nairobi, Kenya',status:'pending',created_at:new Date(Date.now()-86400000).toISOString()},
  {id:'SCH-1002',school_code:'MS-1002',school_name:'Bright Future School',email:'office@brightfuture.example',phone:'+254 711 222 333',address:'Eldoret, Kenya',status:'approved',created_at:new Date(Date.now()-3*86400000).toISOString()},
  {id:'SCH-1003',school_code:'MS-1003',school_name:'Hillside Learning Centre',email:'info@hillside.example',phone:'+254 722 333 444',address:'Kisumu, Kenya',status:'pending',created_at:new Date(Date.now()-5*86400000).toISOString()}
 ],
 users:[],plans:[
  {id:'PLAN-1',plan_name:'Basic',monthly_price:500,annual_price:5000,price:500,duration_days:30,active:true,is_active:true,description:'For small schools'},
  {id:'PLAN-2',plan_name:'Standard',monthly_price:1000,annual_price:10000,price:1000,duration_days:30,active:true,is_active:true,description:'For growing schools'},
  {id:'PLAN-3',plan_name:'Premium',monthly_price:2000,annual_price:20000,price:2000,duration_days:30,active:true,is_active:true,description:'For larger institutions'}
 ],
 subscriptions:[],notifications:[],support:[
  {id:'TKT-001',subject:'Unable to add learners',message:'Please help us add learners to our school account.',school_id:'SCH-1002',status:'open',created_at:new Date().toISOString()}
 ],activity:[],settings:{platform_name:'My School System',support_email:'support@example.com',currency:'KES',maintenance_mode:false,allow_registration:true},connected:false
};
let state=loadState(),currentPage='overview';
function loadState(){try{const s=localStorage.getItem(STORE);if(s)return {...structuredClone(initial),...JSON.parse(s)};}catch(e){}return structuredClone(initial)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function log(action,details=''){state.activity.unshift({id:'LOG-'+Date.now(),action,details,created_at:new Date().toISOString()});state.activity=state.activity.slice(0,150);save()}
function toast(message,type=''){const el=document.createElement('div');el.className='toast '+(type==='error'?'bad':type==='success'?'good':'');el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),3600)}
function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function badge(status){let s=String(status||'pending').toLowerCase().replace(/\s+/g,'-');return `<span class="badge ${esc(s)}">${esc(status||'pending')}</span>`}
function pageTitle(p){return ({overview:'Platform Overview',schools:'School Management',users:'User Management',subscriptions:'Subscriptions & Plans',notifications:'Notifications',support:'Support Center',reports:'Reports & Analytics',activity:'Activity Logs',settings:'Platform Settings',modules:'All Modules',connection:'Database Connection'})[p]||'Platform Overview'}
function go(p){currentPage=p;$('#crumb').textContent=pageTitle(p);$('#topTitle').textContent=pageTitle(p);$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
function stat(label,value,icon,foot){return `<div class="stat"><div class="stat-head"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${foot}</small></div>`}
function panelHead(title,sub='',right=''){return `<div class="panel-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`}
function schoolTable(rows){if(!rows.length)return `<div class="empty">No schools match your search.</div>`;return `<div class="table-wrap"><table><thead><tr><th>School</th><th>Contact</th><th>Registered</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td><div class="school-name">${esc(s.school_name)}</div><div class="subline">${esc(s.school_code||s.id)}</div></td><td>${esc(s.email||'—')}<div class="subline">${esc(s.phone||'')}</div></td><td>${fmtDate(s.created_at)}</td><td>${badge(s.status)}</td><td><div class="actions"><button class="btn small" data-action="view-school" data-id="${esc(s.id)}">View</button>${s.status!=='approved'?`<button class="btn small success" data-action="approve-school" data-id="${esc(s.id)}">Approve</button>`:''}${s.status!=='rejected'?`<button class="btn small danger" data-action="reject-school" data-id="${esc(s.id)}">Reject</button>`:''}<button class="btn small" data-action="edit-school" data-id="${esc(s.id)}">Edit</button></div></td></tr>`).join('')}</tbody></table></div>`}
function overview(){const pending=state.schools.filter(s=>s.status==='pending').length,approved=state.schools.filter(s=>s.status==='approved').length;return `
<div class="welcome"><div><h2>Welcome, Developer 👋</h2><p>Manage registrations, accounts, subscriptions and platform operations from one place.</p></div><button class="btn primary" data-action="add-school">＋ Register school</button></div>
<div class="notice info"><strong>Interactive preview:</strong> all dashboard controls work locally. Changes are saved in this browser. Supabase connection is not active in this file yet, so these demo changes do not update your live database.</div>
<div class="stats">${stat('Total schools',state.schools.length,'🏫','All registered school records')}${stat('Pending approval',pending,'⏳','Waiting for your decision')}${stat('Approved schools',approved,'✓','Approved registrations')}${stat('Support requests',state.support.filter(t=>t.status==='open').length,'🎧','Open support tickets')}</div>
<div class="layout-two"><section class="panel">${panelHead('Recent school registrations','Review new registrations',`<button class="btn small" data-page-go="schools">View all →</button>`)}${schoolTable([...state.schools].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5))}</section>
<section class="panel">${panelHead('Quick actions','Common developer tasks')}<div class="quick-grid"><button class="quick" data-action="add-school"><span class="qicon">🏫</span><span><strong>Register school</strong><small>Add a school record</small></span></button><button class="quick" data-page-go="users"><span class="qicon">♙</span><span><strong>Manage users</strong><small>View user directory</small></span></button><button class="quick" data-page-go="subscriptions"><span class="qicon">💳</span><span><strong>Subscription plans</strong><small>Manage pricing plans</small></span></button><button class="quick" data-page-go="notifications"><span class="qicon">🔔</span><span><strong>Send notification</strong><small>Publish an announcement</small></span></button><button class="quick" data-page-go="support"><span class="qicon">🎧</span><span><strong>Support center</strong><small>Resolve school requests</small></span></button><button class="quick" data-page-go="reports"><span class="qicon">📊</span><span><strong>View reports</strong><small>Platform summaries</small></span></button></div></section></div>
<div class="layout-two"><section class="panel">${panelHead('Latest activity','Actions performed in this browser')}${activityList(state.activity.slice(0,5))}</section><section class="panel">${panelHead('Platform status','Local preview information')}<p class="muted">Dashboard interface <strong style="color:var(--green)">Ready</strong></p><p class="muted">Database connection <strong style="color:var(--amber)">Not connected</strong></p><p class="muted">School approval controls <strong style="color:var(--green)">Working in preview</strong></p><button class="btn" data-page-go="connection">Configure connection →</button></section></div>`}
function activityList(items){return items.length?`<div class="activity">${items.map(a=>`<div class="activity-item"><span class="dot"></span><div><strong>${esc(a.action)}</strong><small>${esc(a.details||'')} · ${fmtDate(a.created_at)}</small></div></div>`).join('')}</div>`:`<div class="empty">No activity recorded yet.</div>`}
function schoolsPage(){return `<div class="page-title"><div><h2>School Management</h2><p>Review registrations and manage school records.</p></div><button class="btn primary" data-action="add-school">＋ Register school</button></div><section class="panel"><div class="filters"><input class="field" id="schoolSearch" placeholder="Search school, code, email or phone"><select id="schoolStatus"><option value="all">All statuses</option><option>pending</option><option>approved</option><option>rejected</option><option>suspended</option></select><button class="btn" data-action="export-schools">Export CSV</button></div><div id="schoolRows">${schoolTable(state.schools)}</div></section>`}
function usersPage(){return `<div class="page-title"><div><h2>User Management</h2><p>Manage platform and school users. Directory starts empty until connected to Supabase.</p></div><button class="btn primary" data-action="add-user">＋ Add user record</button></div><div class="notice">This is a local user directory preview. Creating a record here does not create a Supabase Auth login.</div><section class="panel"><div class="filters"><input class="field" id="userSearch" placeholder="Search name, email or role"><button class="btn" data-action="export-users">Export CSV</button></div><div id="userRows">${userTable(state.users)}</div></section>`}
function userTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${badge(u.is_active?'active':'inactive')}</td><td><button class="btn small" data-action="toggle-user" data-id="${esc(u.id)}">${u.is_active?'Deactivate':'Activate'}</button> <button class="btn small danger" data-action="delete-user" data-id="${esc(u.id)}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No user records yet. Connect Supabase to load registered accounts.</div>`}
function subsPage(){return `<div class="page-title"><div><h2>Subscriptions & Plans</h2><p>Manage plan display and review subscriptions.</p></div><button class="btn primary" data-action="add-plan">＋ Add plan</button></div><div class="notice">Plan edits below are saved in this browser preview only until database connection is configured.</div><div class="plan-grid">${state.plans.map(p=>`<div class="plan"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>${esc(p.plan_name)}</h3>${badge((p.is_active??p.active)?'active':'inactive')}</div><p>${esc(p.description||'School subscription plan')}</p><div class="price">KES ${Number(p.monthly_price??p.price??0).toLocaleString()}<span style="font-size:11px;color:var(--muted);font-weight:500"> / month</span></div><p>KES ${Number(p.annual_price||0).toLocaleString()} / year</p><p>${Number(p.duration_days||30)} days per cycle</p><button class="btn" data-action="edit-plan" data-id="${esc(p.id)}">Edit plan</button> <button class="btn" data-action="toggle-plan" data-id="${esc(p.id)}">${(p.is_active??p.active)?'Deactivate':'Activate'}</button></div>`).join('')}</div><section class="panel" style="margin-top:17px">${panelHead('School subscriptions','Preview records')}${subscriptionTable()}</section>`}
function subscriptionTable(){return state.subscriptions.length?`<div class="table-wrap"><table><thead><tr><th>School</th><th>Plan</th><th>Status</th><th>Start</th><th>Expiry</th><th>Action</th></tr></thead><tbody>${state.subscriptions.map(s=>`<tr><td>${esc(s.school_name||s.school_id)}</td><td>${esc(s.plan_name||'—')}</td><td>${badge(s.status)}</td><td>${fmtDate(s.start_date)}</td><td>${fmtDate(s.expiry_date)}</td><td><button class="btn small" data-action="toggle-subscription" data-id="${esc(s.id)}">Toggle status</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No subscription records in this browser preview.</div>`}
function notificationsPage(){return `<div class="page-title"><div><h2>Notifications</h2><p>Create platform announcements and view saved preview notifications.</p></div><button class="btn primary" data-action="add-notification">＋ New notification</button></div><div class="notice">Notifications created here are preview records. They are not emailed or sent to users until delivery is connected.</div><section class="panel">${panelHead('Notification history','Most recent first')}${state.notifications.length?`<div class="activity">${[...state.notifications].reverse().map(n=>`<div class="activity-item"><span class="dot"></span><div style="flex:1"><strong>${esc(n.title)}</strong><p class="muted" style="margin:5px 0">${esc(n.message)}</p><small>Target: ${esc(n.target_role||'all')} · ${fmtDate(n.created_at)}</small></div><button class="btn small danger" data-action="delete-notification" data-id="${esc(n.id)}">Delete</button></div>`).join('')}</div>`:`<div class="empty">No notifications created yet.</div>`}</section>`}
function supportPage(){return `<div class="page-title"><div><h2>Support Center</h2><p>Track and update school support requests.</p></div><button class="btn primary" data-action="add-ticket">＋ New ticket</button></div><section class="panel"><div class="filters"><input class="field" id="supportSearch" placeholder="Search tickets or school"><select id="supportStatus"><option value="all">All statuses</option><option>open</option><option>in-progress</option><option>resolved</option></select></div><div id="supportRows">${supportTable(state.support)}</div></section>`}
function supportTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Subject</th><th>School</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.id)}</td><td><strong>${esc(t.subject)}</strong><div class="subline">${esc(t.message)}</div></td><td>${esc(state.schools.find(s=>s.id===t.school_id)?.school_name||t.school_id||'—')}</td><td>${badge(t.status)}</td><td>${fmtDate(t.created_at)}</td><td><div class="actions"><button class="btn small" data-action="view-ticket" data-id="${esc(t.id)}">View</button><button class="btn small" data-action="cycle-ticket" data-id="${esc(t.id)}">Next status</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No tickets match.</div>`}
function reportsPage(){const approved=state.schools.filter(s=>s.status==='approved').length,pending=state.schools.filter(s=>s.status==='pending').length,rejected=state.schools.filter(s=>s.status==='rejected').length;return `<div class="page-title"><div><h2>Reports & Analytics</h2><p>Current summary from the records in this browser preview.</p></div><button class="btn primary" data-action="export-report">Download report CSV</button></div><div class="stats">${stat('Total schools',state.schools.length,'🏫','All statuses')}${stat('Approved',approved,'✓','Approved registrations')}${stat('Pending',pending,'⏳','Awaiting review')}${stat('Rejected',rejected,'↘','Rejected registrations')}</div><div class="layout-two"><section class="panel">${panelHead('School registration breakdown','Count by status')}${[['Approved',approved],['Pending',pending],['Rejected',rejected],['Suspended',state.schools.filter(s=>s.status==='suspended').length]].map(([label,n])=>`<div style="margin:17px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><strong>${label}</strong><span>${n}</span></div><div style="height:8px;background:#edf1f8;border-radius:20px;overflow:hidden"><div style="height:100%;width:${state.schools.length?Math.min(100,n/state.schools.length*100):0}%;background:var(--blue);border-radius:20px"></div></div></div>`).join('')}</section><section class="panel">${panelHead('Export and review','Choose a report') }<div class="quick-grid"><button class="quick" data-action="export-schools"><span class="qicon">📄</span><span><strong>School list</strong><small>Download CSV</small></span></button><button class="quick" data-action="export-activity"><span class="qicon">🕘</span><span><strong>Activity log</strong><small>Download CSV</small></span></button><button class="quick" data-action="export-users"><span class="qicon">♙</span><span><strong>User directory</strong><small>Download CSV</small></span></button></div></section></div>`}
function activityPage(){return `<div class="page-title"><div><h2>Activity Logs</h2><p>Review actions performed in this browser preview.</p></div><button class="btn" data-action="export-activity">Export CSV</button></div><section class="panel">${panelHead('Recent activity',`${state.activity.length} recorded action(s)`)}${activityList(state.activity)}</section>`}
function settingsPage(){const s=state.settings;return `<div class="page-title"><div><h2>Platform Settings</h2><p>Configure preview settings. These values are not yet synced to Supabase.</p></div><button class="btn primary" data-action="save-settings">Save settings</button></div><section class="panel"><form id="settingsForm"><div class="form-grid"><label class="form-field">Platform name<input name="platform_name" required value="${esc(s.platform_name)}"></label><label class="form-field">Support email<input name="support_email" type="email" value="${esc(s.support_email)}"></label><label class="form-field">Currency<select name="currency"><option ${s.currency==='KES'?'selected':''}>KES</option><option ${s.currency==='USD'?'selected':''}>USD</option><option ${s.currency==='UGX'?'selected':''}>UGX</option><option ${s.currency==='TZS'?'selected':''}>TZS</option></select></label><label class="form-field">Registration<select name="allow_registration"><option value="true" ${s.allow_registration?'selected':''}>Open</option><option value="false" ${!s.allow_registration?'selected':''}>Closed</option></select></label><label class="form-field full">Maintenance mode<select name="maintenance_mode"><option value="false" ${!s.maintenance_mode?'selected':''}>Off</option><option value="true" ${s.maintenance_mode?'selected':''}>On</option></select></label></div><div class="form-actions"><button class="btn primary" type="submit">Save settings</button></div></form></section><section class="panel">${panelHead('Data tools','For this browser preview only')}<button class="btn" data-action="backup-json">Export preview backup (JSON)</button> <button class="btn danger" data-action="reset-demo">Reset demo data</button><p class="muted">Reset only affects this browser's preview records. It does not touch Supabase.</p></section>`}
function modulesPage(){const modules=[['🏫','School management','Register, review, approve, reject and edit school records.','schools'],['♙','User management','Manage local user directory preview records.','users'],['💳','Subscriptions','Review and edit subscription plan cards.','subscriptions'],['🔔','Notifications','Create and manage local announcement records.','notifications'],['🎧','Support center','Track tickets and update their status.','support'],['📊','Reports','Review totals and export CSV reports.','reports'],['🕘','Activity logs','Review actions and export logs.','activity'],['⚙','Platform settings','Save local platform display settings.','settings'],['🔌','Database connection','View setup requirements for Supabase.','connection']];return `<div class="page-title"><div><h2>All Modules</h2><p>Open any module. All listed module controls are active in preview mode.</p></div></div><div class="module-grid">${modules.map(m=>`<article class="module-card"><div class="bigico">${m[0]}</div><h3>${m[1]}</h3><p>${m[2]}</p><button class="btn" data-page-go="${m[3]}">Open module →</button></article>`).join('')}</div>`}
function connectionPage(){return `<div class="page-title"><div><h2>Database Connection</h2><p>Supabase integration checklist for the live platform.</p></div><span class="mode">Not connected</span></div><div class="notice info"><strong>Current behavior:</strong> this file runs as a standalone interactive dashboard. It saves preview changes to your browser's local storage. It does not write to your Supabase project until a verified client connection and table-specific handlers are added.</div><section class="panel">${panelHead('Connection status','Configuration is intentionally not guessed')}<div class="activity"><div class="activity-item"><span class="dot"></span><div><strong>Dashboard UI</strong><small>Loaded in browser</small></div><span style="margin-left:auto;color:var(--green);font-size:11px">Ready</span></div><div class="activity-item"><span class="dot" style="background:#e0a12a"></span><div><strong>Supabase URL and publishable key</strong><small>Need to be verified in the connection code</small></div><span style="margin-left:auto;color:var(--amber);font-size:11px">Pending</span></div><div class="activity-item"><span class="dot" style="background:#e0a12a"></span><div><strong>Table schemas and RLS policies</strong><small>Must match the exact existing columns and intended roles</small></div><span style="margin-left:auto;color:var(--amber);font-size:11px">Verify</span></div><div class="activity-item"><span class="dot" style="background:#e0a12a"></span><div><strong>Live read/write test</strong><small>Must be tested after connection</small></div><span style="margin-left:auto;color:var(--amber);font-size:11px">Pending</span></div></div></section><section class="panel">${panelHead('What is required next','Connect without changing the working login')}<ol style="font-size:12px;line-height:2.1;color:var(--muted)"><li>Keep your existing Supabase project URL and publishable key.</li><li>Verify the real column types and names for all existing tables.</li><li>Load the Supabase JavaScript client and reuse the signed-in session.</li><li>Connect each module with its own read/write handler and error messages.</li><li>Test school approval and rejection against a test school record first.</li></ol><button class="btn primary" data-action="connection-check">Run local interface check</button></section>`}
function render(){const c=$('#content');const pages={overview,schools:schoolsPage,users:usersPage,subscriptions:subsPage,notifications:notificationsPage,support:supportPage,reports:reportsPage,activity:activityPage,settings:settingsPage,modules:modulesPage,connection:connectionPage};c.innerHTML=(pages[currentPage]||overview)();$('#modeBadge').textContent='● Preview mode';$('#sideMode').textContent='Interactive preview mode';}
function openModal(title,body,submitLabel='Save',onSubmit=null){$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><div class="modal"><div class="modal-top"><h2>${title}</h2><button class="xbtn" data-action="close-modal" aria-label="Close">×</button></div><div id="modalBody">${body}</div>${onSubmit?`<div class="form-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="modalSubmit">${submitLabel}</button></div>`:''}</div></div>`;if(onSubmit)$('#modalSubmit').addEventListener('click',()=>onSubmit($('#modalBody')))}
function closeModal(){$('#modalRoot').innerHTML=''}
function field(label,name,value='',type='text',required=true){return `<label class="form-field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`}
function addSchoolModal(s=null){const edit=!!s;openModal(edit?'Edit school':'Register a school',`<form id="schoolForm" class="form-grid">${field('School name','school_name',s?.school_name||'')}${field('School code','school_code',s?.school_code||'MS-'+Math.floor(1000+Math.random()*9000))}${field('Contact email','email',s?.email||'','email')}${field('Phone','phone',s?.phone||'','tel',false)}<label class="form-field full">Address<input name="address" value="${esc(s?.address||'')}" required></label>${edit?`<label class="form-field">Status<select name="status">${['pending','approved','rejected','suspended'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></label>`:''}</form>`,'Save school',root=>{const f=$('#schoolForm',root);if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(edit){Object.assign(s,d);log('Updated school',s.school_name)}else{const n={...d,id:'SCH-'+Date.now(),status:'pending',created_at:new Date().toISOString()};state.schools.unshift(n);log('Registered school',n.school_name)}save();closeModal();render();toast(edit?'School updated in preview':'School registered in preview','success')})}
function addUserModal(){openModal('Add user directory record',`<form id="userForm" class="form-grid">${field('Full name','full_name')}${field('Email','email','','email')}<label class="form-field">Role<select name="role"><option>school_admin</option><option>teacher</option><option>developer</option><option>accountant</option></select></label><label class="form-field">Status<select name="is_active"><option value="true">Active</option><option value="false">Inactive</option></select></label></form><p class="muted">This adds a directory preview only, not a Supabase Auth account.</p>`,'Add record',root=>{const f=$('#userForm',root);if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));state.users.push({...d,id:'USR-'+Date.now(),is_active:d.is_active==='true'});log('Added user directory record',d.email);save();closeModal();render();toast('User record added in preview','success')})}
function planModal(p=null){const edit=!!p;openModal(edit?'Edit subscription plan':'Add subscription plan',`<form id="planForm" class="form-grid">${field('Plan name','plan_name',p?.plan_name||'')}${field('Monthly price (KES)','monthly_price',p?.monthly_price??p?.price??0,'number')}${field('Annual price (KES)','annual_price',p?.annual_price??0,'number')}${field('Duration in days','duration_days',p?.duration_days??30,'number')}<label class="form-field full">Description<textarea name="description" rows="3">${esc(p?.description||'')}</textarea></label></form>`,'Save plan',root=>{const f=$('#planForm',root);if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));d.monthly_price=Number(d.monthly_price);d.price=d.monthly_price;d.annual_price=Number(d.annual_price);d.duration_days=Number(d.duration_days);d.is_active=p?(p.is_active??p.active):true;d.active=d.is_active;if(edit)Object.assign(p,d);else state.plans.push({...d,id:'PLAN-'+Date.now()});log(edit?'Edited plan':'Created plan',d.plan_name);save();closeModal();render();toast('Plan saved in preview','success')})}
function notificationModal(){openModal('Create notification',`<form id="notifyForm" class="form-grid">${field('Title','title') }<label class="form-field full">Message<textarea name="message" rows="4" required></textarea></label><label class="form-field full">Target audience<select name="target_role"><option value="all">All users</option><option value="school_admin">School administrators</option><option value="teacher">Teachers</option><option value="developer">Developers</option></select></label></form>`,'Create notification',root=>{const f=$('#notifyForm',root);if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));state.notifications.push({...d,id:'NTF-'+Date.now(),created_at:new Date().toISOString()});log('Created notification',d.title);save();closeModal();render();toast('Notification saved in preview only','success')})}
function ticketModal(){openModal('Create support ticket',`<form id="ticketForm" class="form-grid">${field('Subject','subject') }<label class="form-field full">Message<textarea name="message" rows="4" required></textarea></label><label class="form-field full">School<select name="school_id"><option value="">Not assigned</option>${state.schools.map(s=>`<option value="${esc(s.id)}">${esc(s.school_name)}</option>`).join('')}</select></label></form>`,'Create ticket',root=>{const f=$('#ticketForm',root);if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));state.support.push({...d,id:'TKT-'+Date.now(),status:'open',created_at:new Date().toISOString()});log('Created support ticket',d.subject);save();closeModal();render();toast('Ticket created in preview','success')})}
function viewSchool(id){const s=state.schools.find(x=>x.id===id);if(!s)return;openModal('School details',`<div class="form-grid"><div><div class="muted">School name</div><strong>${esc(s.school_name)}</strong></div><div><div class="muted">School code</div><strong>${esc(s.school_code)}</strong></div><div><div class="muted">Email</div><strong>${esc(s.email)}</strong></div><div><div class="muted">Phone</div><strong>${esc(s.phone||'—')}</strong></div><div class="form-field full"><div class="muted">Address</div><strong>${esc(s.address||'—')}</strong></div><div><div class="muted">Status</div>${badge(s.status)}</div><div><div class="muted">Created</div><strong>${fmtDate(s.created_at)}</strong></div></div>`)}
function confirmAction(title,message,yes){openModal(title,`<p style="font-size:13px;line-height:1.7">${message}</p>`,'Confirm',()=>{closeModal();yes()})}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(filename,rows){if(!rows.length){toast('There is no data to export yet.');return}const headers=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv=[headers.map(csvCell).join(','),...rows.map(r=>headers.map(k=>csvCell(r[k])).join(','))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);toast('CSV export downloaded','success')}
function doAction(action,id){switch(action){
case 'add-school':addSchoolModal();break;
case 'edit-school':{const s=state.schools.find(x=>x.id===id);if(s)addSchoolModal(s);break}
case 'view-school':viewSchool(id);break;
case 'approve-school':{const s=state.schools.find(x=>x.id===id);if(s)confirmAction('Approve school',`Approve <strong>${esc(s.school_name)}</strong> in this browser preview?`,()=>{s.status='approved';log('Approved school',s.school_name);save();render();toast('School approved in preview only','success')});break}
case 'reject-school':{const s=state.schools.find(x=>x.id===id);if(s)confirmAction('Reject school',`Reject <strong>${esc(s.school_name)}</strong> in this browser preview?`,()=>{s.status='rejected';log('Rejected school',s.school_name);save();render();toast('School rejected in preview only','success')});break}
case 'add-user':addUserModal();break;
case 'toggle-user':{const u=state.users.find(x=>x.id===id);if(u){u.is_active=!u.is_active;log('Changed user status',u.email);save();render();toast('User status updated in preview','success')}break}
case 'delete-user':confirmAction('Delete user record','Delete this local preview user record?',()=>{state.users=state.users.filter(x=>x.id!==id);log('Deleted user directory record',id);save();render();toast('User record deleted from preview','success')});break;
case 'add-plan':planModal();break;
case 'edit-plan':{const p=state.plans.find(x=>x.id===id);if(p)planModal(p);break}
case 'toggle-plan':{const p=state.plans.find(x=>x.id===id);if(p){p.is_active=!(p.is_active??p.active);p.active=p.is_active;log('Changed plan status',p.plan_name);save();render();toast('Plan status updated in preview','success')}break}
case 'toggle-subscription':{const s=state.subscriptions.find(x=>x.id===id);if(s){s.status=s.status==='active'?'suspended':'active';log('Changed subscription status',id);save();render();toast('Subscription status updated in preview','success')}break}
case 'add-notification':notificationModal();break;
case 'delete-notification':confirmAction('Delete notification','Delete this local notification record?',()=>{state.notifications=state.notifications.filter(x=>x.id!==id);log('Deleted notification',id);save();render();toast('Notification deleted from preview','success')});break;
case 'add-ticket':ticketModal();break;
case 'view-ticket':{const t=state.support.find(x=>x.id===id);if(t)openModal('Support request',`<p><strong>${esc(t.subject)}</strong></p><p style="font-size:13px;line-height:1.7">${esc(t.message)}</p><p class="muted">School: ${esc(state.schools.find(s=>s.id===t.school_id)?.school_name||t.school_id||'Unassigned')}</p><p>Status: ${badge(t.status)}</p>`);break}
case 'cycle-ticket':{const t=state.support.find(x=>x.id===id);if(t){t.status=({'open':'in-progress','in-progress':'resolved','resolved':'open'})[t.status]||'open';log('Changed support ticket status',`${t.id}: ${t.status}`);save();render();toast('Ticket status: '+t.status,'success')}break}
case 'save-settings':saveSettings();break;
case 'export-schools':exportCSV('my-school-schools.csv',state.schools);break;
case 'export-users':exportCSV('my-school-users.csv',state.users);break;
case 'export-activity':exportCSV('my-school-activity.csv',state.activity);break;
case 'export-report':exportCSV('my-school-report.csv',[{metric:'Total schools',value:state.schools.length},{metric:'Approved',value:state.schools.filter(s=>s.status==='approved').length},{metric:'Pending',value:state.schools.filter(s=>s.status==='pending').length},{metric:'Rejected',value:state.schools.filter(s=>s.status==='rejected').length}]);break;
case 'backup-json':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-school-preview-backup.json';a.click();URL.revokeObjectURL(url);toast('Preview backup downloaded','success');break}
case 'reset-demo':confirmAction('Reset preview data','Reset only the data saved by this dashboard in this browser? This will not affect Supabase.',()=>{state=structuredClone(initial);save();log('Reset preview data','Local demo data restored');save();render();toast('Preview data reset','success')});break;
case 'connection-check':toast('Interface check passed: navigation, modal actions, forms and preview storage are enabled. Supabase is not connected.','success');log('Ran local interface check','Supabase not connected');save();break;
default:toast('This control is not available yet.','error')
}}
function saveSettings(){const f=$('#settingsForm');if(!f)return;const d=Object.fromEntries(new FormData(f));d.maintenance_mode=d.maintenance_mode==='true';d.allow_registration=d.allow_registration==='true';state.settings=d;log('Saved platform settings','Local preview settings updated');save();render();toast('Settings saved in this browser','success')}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return}
 const goBtn=e.target.closest('[data-page-go]');if(goBtn){go(goBtn.dataset.pageGo);return}
 const actionBtn=e.target.closest('[data-action]');if(actionBtn){const a=actionBtn.dataset.action;if(a==='close-modal'){closeModal();return}if(a==='backdrop-close'&&e.target===actionBtn){closeModal();return}doAction(a,actionBtn.dataset.id);return}
});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();saveSettings()}});
document.addEventListener('input',e=>{if(e.target.id==='schoolSearch'||e.target.id==='schoolStatus'){const q=($('#schoolSearch')?.value||'').toLowerCase(),st=$('#schoolStatus')?.value||'all';const rows=state.schools.filter(s=>(st==='all'||s.status===st)&&[s.school_name,s.school_code,s.email,s.phone].some(v=>String(v||'').toLowerCase().includes(q)));const target=$('#schoolRows');if(target)target.innerHTML=schoolTable(rows)}if(e.target.id==='userSearch'){const q=e.target.value.toLowerCase();const target=$('#userRows');if(target)target.innerHTML=userTable(state.users.filter(u=>[u.full_name,u.email,u.role].some(v=>String(v||'').toLowerCase().includes(q))))}if(e.target.id==='supportSearch'||e.target.id==='supportStatus'){const q=($('#supportSearch')?.value||'').toLowerCase(),st=$('#supportStatus')?.value||'all';const rows=state.support.filter(t=>(st==='all'||t.status===st)&&[t.id,t.subject,t.message,t.school_id].some(v=>String(v||'').toLowerCase().includes(q)));const target=$('#supportRows');if(target)target.innerHTML=supportTable(rows)}});
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#refreshBtn').addEventListener('click',()=>{render();toast('Dashboard refreshed from browser preview','success')});
window.addEventListener('storage',e=>{if(e.key===STORE){state=loadState();render()}});
render();
</script>
</body>
</html>
