
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }
    .container {
      max-width: 1000px;
      margin: auto;
    }
    .panel {
      background: white;
      padding: 20px;
      margin: 18px 0;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }
    h1, h2 { color: #174ea6; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 6px;
      font-size: 15px;
    }
    input, select { border: 1px solid #cbd5e1; }
    button {
      background: #174ea6;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .back { width: auto; padding: 10px 18px; }
    .message { white-space: pre-wrap; }
    .error { color: #b91c1c; }
    .success { color: #166534; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
<div class="container">
  <button class="back" id="backButton" type="button">← Back to Dashboard</button>

  <h1>Student Management</h1>
  <p>Register and manage students in Grades 1–9.</p>

  <section class="panel">
    <h2>Register Student</h2>
    <form id="studentForm">
      <label for="admission">Admission number *</label>
      <input id="admission" required placeholder="e.g. ADM001">

      <label for="firstName">First name *</label>
      <input id="firstName" required>

      <label for="lastName">Last name *</label>
      <input id="lastName" required>

      <label for="gender">Gender</label>
      <select id="gender">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <label for="classId">Grade</label>
      <select id="classId">
        <option value="">Loading grades...</option>
      </select>

      <label for="guardian">Guardian name</label>
      <input id="guardian">

      <label for="phone">Guardian phone</label>
      <input id="phone" type="tel">

      <button id="saveButton" type="submit">Register Student</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <h2>Registered Students</h2>
    <button id="refreshButton" type="button">Refresh List</button>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Admission No.</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Grade</th>
            <th>Guardian</th>
            <th>Phone</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="studentRows">
          <tr><td colspan="7">Loading students...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<script>
  // Use the SAME project URL and publishable key as index.html.
  const SUPABASE_URL = "https://apshhzczrofxwjsgenlv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_I6kPWgrxTxCgo_EUCGucLA_LtiJXtyP";

  const message = document.getElementById("message");
  const studentRows = document.getElementById("studentRows");
  const saveButton = document.getElementById("saveButton");
  const classSelect = document.getElementById("classId");

  let client;

  function showMessage(text, error = false) {
    message.textContent = text;
    message.className = "message " + (error ? "error" : "success");
  }

  async function startPage() {
    if (!window.supabase) {
      showMessage("Supabase library did not load. Check your internet.", true);
      return;
    }

    if (SUPABASE_URL.includes("PASTE_") ||
        SUPABASE_KEY.includes("PASTE_")) {
      showMessage("Add your Supabase URL and publishable key in this file.", true);
      return;
    }

    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data, error } = await client.auth.getSession();
    if (error) {
      showMessage(error.message, true);
      return;
    }

    if (!data.session) {
      showMessage("Please log in first.", true);
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1200);
      return;
    }

    await loadClasses();
    await loadStudents();
  }

  async function loadClasses() {
    const { data, error } = await client
      .from("classes")
      .select("id, class_name")
      .order("id");

    if (error) {
      classSelect.innerHTML = '<option value="">Could not load grades</option>';
      showMessage("Could not load grades: " + error.message, true);
      return;
    }

    classSelect.innerHTML = '<option value="">Select grade</option>';

    data.forEach(item => {
      const option = document.createElement("option");
      option.value = item.id;
      option.textContent = item.class_name;
      classSelect.appendChild(option);
    });
  }

  async function loadStudents() {
    studentRows.innerHTML = '<tr><td colspan="7">Loading...</td></tr>';

    const { data, error } = await client
      .from("students")
      .select("id, admission_number, first_name, last_name, gender, guardian_name, guardian_phone, classes(class_name)")
      .order("admission_number");

    if (error) {
      studentRows.innerHTML = "";
      showMessage("Could not load students: " + error.message, true);
      return;
    }

    studentRows.innerHTML = "";

    if (!data.length) {
      studentRows.innerHTML =
        '<tr><td colspan="7">No students registered yet.</td></tr>';
      return;
    }

    data.forEach(student => {
      const row = document.createElement("tr");
      const values = [
        student.admission_number,
        student.first_name + " " + student.last_name,
        student.gender || "-",
        student.classes?.class_name || "-",
        student.guardian_name || "-",
        student.guardian_phone || "-"
      ];

      values.forEach(value => {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      });

      const actionCell = document.createElement("td");
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.addEventListener("click", async () => {
        if (!confirm("Delete student " + student.first_name + " " +
                     student.last_name + "?")) return;

        deleteButton.disabled = true;
        const { error: deleteError } = await client
          .from("students")
          .delete()
          .eq("id", student.id);

        if (deleteError) {
          showMessage("Delete failed: " + deleteError.message, true);
          deleteButton.disabled = false;
          return;
        }

        showMessage("Student deleted.");
        await loadStudents();
      });

      actionCell.appendChild(deleteButton);
      row.appendChild(actionCell);
      studentRows.appendChild(row);
    });
  }

  document.getElementById("studentForm").addEventListener("submit", async event => {
    event.preventDefault();
    saveButton.disabled = true;
    showMessage("Saving student...");

    try {
      const admission = document.getElementById("admission").value.trim();
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const gender = document.getElementById("gender").value;
      const classValue = classSelect.value;
      const guardian = document.getElementById("guardian").value.trim();
      const phone = document.getElementById("phone").value.trim();

      const record = {
        admission_number: admission,
        first_name: firstName,
        last_name: lastName,
        gender: gender || null,
        class_id: classValue ? Number(classValue) : null,
        guardian_name: guardian || null,
        guardian_phone: phone || null
      };

      const { error } = await client.from("students").insert([record]);
      if (error) throw error;

      document.getElementById("studentForm").reset();
      showMessage("Student registered successfully!");
      await loadStudents();
    } catch (error) {
      showMessage("Could not register student: " + error.message, true);
    } finally {
      saveButton.disabled = false;
    }
  });

  document.getElementById("refreshButton").addEventListener("click", loadStudents);

  document.getElementById("backButton").addEventListener("click", () => {
    window.location.href = "index.html";
  });

  startPage();
</script>
</body>
          </html>
