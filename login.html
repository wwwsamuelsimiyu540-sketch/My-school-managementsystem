
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My School System Login</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
main{background:white;padding:25px;border-radius:12px;width:100%;max-width:400px;box-sizing:border-box}
label{display:block;margin-top:15px;font-weight:bold}
input,button{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;font-size:16px}
button{background:#123b70;color:white;border:0;border-radius:6px;margin-top:20px}
#message{line-height:1.5;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>My School System</h1>
<p>Sign in to your account</p>
<form id="loginForm">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginButton" type="submit">Sign In</button>
</form>
<p id="message" role="status"></p>
<p><a href="school-admin-register.html">Register administrator</a></p>
<p><a href="register-school.html">Register school</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
const message=document.getElementById("message");
const button=document.getElementById("loginButton");
if(!window.supabase){
message.textContent="Supabase failed to load. Check your internet connection and reload.";
return;
}
const db=window.supabase.createClient(
"https://apshhzczrofxwjsgenlv.supabase.co",
"sb_publishable_I6kPWgrxTxCgo_EUCGucLA_LtiJXtyP"
);
document.getElementById("loginForm").addEventListener("submit",async function(e){
e.preventDefault();
button.disabled=true;
message.textContent="Signing in...";
try{
const email=document.getElementById("email").value.trim().toLowerCase();
const password=document.getElementById("password").value;
const {data:auth,error:authError}=await db.auth.signInWithPassword({email,password});
if(authError) throw authError;
const {data:profile,error:profileError}=await db
.from("msys_user_profiles")
.select("id,role,school_id,status")
.eq("id",auth.user.id)
.maybeSingle();
if(profileError) throw new Error("Profile lookup failed: "+profileError.message);
if(!profile){
await db.auth.signOut();
throw new Error("No system profile found for this account. Contact the developer.");
}
const role=(profile.role||"").toLowerCase();
const status=(profile.status||"").toLowerCase();
if(role==="platform_developer"||role==="developer"){
location.replace("developer-dashboard.html");
return;
}
if(status!=="approved"&&status!=="active"){
await db.auth.signOut();
throw new Error("Your account is pending approval or is not active.");
}
if(role==="school_admin"||role==="school_administrator"){
if(!profile.school_id) throw new Error("Your account has no assigned school.");
location.replace("school-admin.html");
return;
}
if(role==="teacher"){location.replace("teachers.html");return;}
if(role==="student"){location.replace("student.html");return;}
await db.auth.signOut();
throw new Error("No dashboard is configured for role: "+role);
}catch(err){
message.textContent=err.message||"Login failed.";
button.disabled=false;
}
});
})();
</script>
</body>
</html>
