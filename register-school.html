
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Registration | My School</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 22px #00000012;
    }

    h1 { color: #164e9a; margin-top: 0; }
    p { color: #64748b; line-height: 1.5; }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 7px;
      background: #164e9a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }
    #message { margin-top: 18px; font-weight: bold; }
    .note { font-size: 13px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Register Your School</h1>
    <p>Submit your school's information for review by the system developer.</p>

    <form id="schoolForm">
      <label for="schoolName">School Name *</label>
      <input id="schoolName" name="schoolName"
        placeholder="Enter the official school name"
        required maxlength="150">

      <label for="schoolType">School Type *</label>
      <select id="schoolType" name="schoolType" required>
        <option value="">Select school type</option>
        <option>Primary School</option>
        <option>Junior School</option>
        <option>Secondary School</option>
        <option>College</option>
        <option>Other</option>
      </select>

      <label for="county">County *</label>
      <input id="county" name="county"
        placeholder="e.g. Uasin Gishu" required maxlength="100">

      <label for="location">Town or Location *</label>
      <input id="location" name="location"
        placeholder="Enter town or location" required maxlength="150">

      <label for="adminName">School Administrator's Name *</label>
      <input id="adminName" name="adminName"
        placeholder="Full name" required maxlength="150">

      <label for="email">Administrator Email *</label>
      <input id="email" name="email" type="email"
        placeholder="admin@example.com" required maxlength="254">

      <label for="phone">Phone Number *</label>
      <input id="phone" name="phone" type="tel"
        placeholder="e.g. 07XXXXXXXX" required maxlength="30">

      <label for="address">School Address</label>
      <textarea id="address" name="address" rows="3"
        placeholder="Enter the school address" maxlength="500"></textarea>

      <button id="submitButton" type="submit">
        Submit Registration
      </button>

      <p class="note">
        Your registration will require review. Do not submit passwords
        or other confidential information on this form.
      </p>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    /*
      This is the registration form interface only.
      Supabase has not been connected yet.
    */

    const form = document.getElementById("schoolForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      message.style.color = "#9a3412";
      message.textContent =
        "The form is working, but database submission is not connected yet. " +
        "Complete the Supabase setup before registering a real school.";
    });
  </script>
</body>
</html>
